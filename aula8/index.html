<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula 8</title>
</head>
<body>
    <!-- Tabelas -->
    <!-- 
    <table> = define a tabela 
    <thead> = define a região do cabeçalho
    <tr> = define uma linha da tabela
    <th> = define um cabeçalho (Deixa em negrito)
    <tbody> = define a região do corpo 
    <td> = define uma célula (dados da tabela)
    <border> = "1" = adiciona bordas na tabela                       
    -->
    <table border="1">
        <thead>
            <tr>
                <th>nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rafaella</td>
                <td>16</td>
                <td>Soberana</td>
            </tr>
            <tr>
                <td>Talita</td>
                <td>16</td>
                <td>Taboao</td>
            </tr>
        </tbody>
    </table>



</body>
</html>
