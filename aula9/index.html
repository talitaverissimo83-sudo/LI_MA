<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    <Form> = define um formulário
    <input> = campo de entrada (com vários tipos: text, password, email, number, etc...)
    <label> = associa um texto descritivo a um <input>
    <textarea = area do texto maior
    <select> e <option> = criam menus suspensos (dropdowns)
    <button> = botão clicável 
    <fieldset> e <legend> = agrupam e nomeiam partes de um formulário
    <datalist> = lista de sugestões para "input"                 
    -->
    <h1>Formulário completo</h1>

    <form action="/enviar-dados" method="post">
        <fieldset>
        <legend>informações pessoais</legend>

        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome"
        placeholder="Digite seu nome" required><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"
        placeholder="seuemail@euamosenai.com.br"
        required><br>

        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade"
        min="18" max="99">

        <label for="data de nascimento">Data de nascimento</label>
        <input type="date" id="data de nascimento"


        <label for="genero">genero</label>
        <select name="genero" id="genero">
            <option value="masculino"></option>
        </select>

        </fieldset>

        <fieldset>
            <legend>Detalhes adicionais</legend>

            <label for="bio">Sobre você:</label>
            <textarea id="bio" name="bio" rows="3"
            placeholder="Fale um pouco sobre você..."
        </textarea>


        </fieldset>




    </form>
</body>
</html>
