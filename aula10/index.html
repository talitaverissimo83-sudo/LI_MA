<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo</title>

    <!-- CSS Interno -->
    <!-- Ele fica dentro da tag <style> no <head> do HTML -->
    <style>
        h1 {
            color: blue;
        }
    </style> 
    <!-- CSS Externo - O MELHOR DE TODOS!!!!! -->
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    
<!-- CSS (Cascading Style Sheets) é o que da forma, cor, design e estilo ao HTML -->
<!-- CSS inline -->
<!-- --> 

<h1 style="font-size: 120px;"></h1>

</body>
</html>
